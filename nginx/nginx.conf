upstream finovo_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Increase max upload size for deposits/documents
    client_max_body_size 100M;

    # 1. Django Backend API, Admin, and Health Check
    location ~ ^/(api|admin|health) {
        proxy_pass http://finovo_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # 2. Django Static Files
    location /static/ {
        alias /app/static/;
    }

    # 3. Django Media Files
    location /media/ {
        alias /app/media/;
    }

    # 4. Frontend Application (Fallback to index.html for SPA routing)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
